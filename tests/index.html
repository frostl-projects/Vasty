<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vasty — проверки</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 20px; color: #eef2ff; background: #0a0c12; font: 14px system-ui, sans-serif; }
    button { padding: 10px 16px; cursor: pointer; }
    #results { line-height: 1.7; }
    .pass { color: #83efad; }
    .fail { color: #ff9696; }
    iframe { display: block; width: 100%; height: 850px; border: 1px solid #30394f; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Регрессионные проверки Vasty</h1>
  <button id="run" type="button">Запустить проверки</button>
  <p id="status" role="status">Готово к запуску</p>
  <ol id="results"></ol>
  <details><summary>ZIP для проверки внешним архиватором (base64)</summary><pre id="archiveEvidence"></pre></details>
  <iframe id="app" src="../index.html" title="Vasty под проверкой"></iframe>
  <script src="./regression.js"></script>
</body>
</html>
