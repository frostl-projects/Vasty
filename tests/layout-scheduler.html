<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Vasty layout scheduler fixture</title>
  <style>
    html, body, #vast-player, .rmp-vpaid-container { width: 640px; height: 360px; margin: 0; }
    #vast-player, .rmp-vpaid-container { position: relative; }
    .fixture-layer { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
  </style>
  <script>
    // Model a document where rendering is suspended: callbacks stay queued forever.
    window.requestAnimationFrame = () => 1;
  </script>
</head>
<body>
  <div id="vast-player">
    <div class="rmp-vpaid-container">
      <div class="fixture-wrapper">
        <div class="fixture-content">
          <img alt="Фон">
          <div class="fixture-layer">
            <div class="plyr"><div class="plyr__video-wrapper"><video></video></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../vasty-core.js"></script>
  <script>
    Object.assign(window.Vasty, {
      log() {},
      registerModule() {},
      buildDiagnosticReport() { return ''; },
      buildDiagnosticFiles() { return []; }
    });
  </script>
  <script src="../vpaid-transition-compat.js"></script>
  <script src="../vpaid-layout-compat.js"></script>
</body>
</html>
